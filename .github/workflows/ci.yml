name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# One run per ref: a new push supersedes the in-flight run for the same branch.
# main is exempt — we want a complete record of every commit that landed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Must match gradle/gradle-daemon-jvm.properties (toolchainVersion=21).
  # If they diverge, Gradle downloads its own JDK on every run.
  JAVA_VERSION: "21"
  KTLINT_VERSION: "1.5.0"

jobs:
  # Cheap gates. Everything else waits on these two, then runs in parallel.
  # 1. Course AI policy: the repository must carry an agent rules file.
  agent-rules:
    name: Agent rules file present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require AGENTS.md or CLAUDE.md
        run: |
          found=""
          for name in AGENTS.md CLAUDE.md; do
            if [ -f "${name}" ]; then
              found="${found} ${name}"
            fi
          done
          if [ -z "${found}" ]; then
            echo "::error::No AGENTS.md or CLAUDE.md in the repository root."
            echo "The course AI policy requires an agent rules file describing conventions, architecture and definition of done."
            exit 1
          fi
          echo "Found:${found}"

  # 2. No credentials anywhere in history. Scanning the working tree only
  #    would miss a secret that was committed and later deleted, which is
  #    exactly the case that matters — the commit is still public.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: gitleaks scans every commit

      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect \
              --source /repo \
              --config /repo/.gitleaks.toml \
              --redact \
              --verbose

  # 3. Formatting and Android Lint.
  static-checks:
    name: Static checks (ktlint + Android Lint)
    runs-on: ubuntu-latest
    needs: [agent-rules, secrets]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install ktlint ${{ env.KTLINT_VERSION }}
        run: |
          curl -sSLO "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          ./ktlint --version

      # Rules and code style come from .editorconfig at the repository root.
      - name: ktlint check
        run: ./ktlint --relative "**/*.kt" "**/*.kts" "!**/build/**"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Android Lint (debug)
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: "**/build/reports/lint-results-debug.*"
          if-no-files-found: ignore
          retention-days: 14

  # 4. JVM unit tests.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [agent-rules, secrets]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/testDebugUnitTest/**
            **/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14

  # 5. Instrumented tests on an emulator. This is where the Reliability QA
  #    (offline cache, background retry, request-status feedback) is exercised
  #    end to end, so it is slow by design and starts as early as possible.
  instrumented-tests:
    name: Instrumented tests (API 34)
    runs-on: ubuntu-latest
    needs: [agent-rules, secrets]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Hardware acceleration: without this the emulator falls back to software
      # rendering and the job times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Without this cache, force-avd-creation: false below is a no-op: there is
      # never an existing AVD, so every run boots one from cold (3-5 minutes).
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-google_apis-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            **/build/reports/androidTests/connected/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14

  # 6. Debug APK.
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: [agent-rules, secrets]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
